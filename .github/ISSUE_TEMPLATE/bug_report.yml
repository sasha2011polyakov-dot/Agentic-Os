name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact error message and its code if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. 0.1.0 or a commit hash
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: e.g. Ubuntu 24.04, Node 22.13.0
  - type: input
    id: model
    attributes:
      label: AI provider and model, if relevant
      placeholder: e.g. Ollama, qwen2.5:14b
