name: Bug report / Ошибка
description: Something does not work as described. / Что-то работает не так, как описано.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately — see SECURITY.md. / Уязвимости сообщайте приватно — см. SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened? / Что произошло?
      description: Include the exact error message and its code if there is one. / Приложите точный текст ошибки и её код, если есть.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как воспроизвести
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / Что ожидалось
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version / Коммит или версия
      placeholder: e.g. 0.1.0 or a commit hash
  - type: input
    id: env
    attributes:
      label: OS and Node.js version / ОС и версия Node.js
      placeholder: e.g. Ubuntu 24.04, Node 22.13.0
  - type: input
    id: model
    attributes:
      label: AI provider and model, if relevant / Провайдер и модель AI, если важно
      placeholder: e.g. Ollama, qwen2.5:14b
